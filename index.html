<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ввод посещаемости - Дежурный учитель</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 500px; margin: 30px auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { font-size: 20px; margin-bottom: 20px; text-align: center; color: #1e293b; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: #2563eb; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        .alert { display: none; margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: 600; }
        .alert-success { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

<div class="container">
    <h2>Форма отметки урока</h2>
    <form id="lessonForm">
        <div class="form-group">
            <label>Класс:</label>
            <input type="text" id="className" placeholder="Например: 9-А или 11-Б" required>
        </div>
        <div class="form-group">
            <label>Общее количество учащихся в классе:</label>
            <input type="number" id="totalCount" min="1" placeholder="Например: 21" required>
        </div>
        <div class="form-group">
            <label>Выберите номер урока:</label>
            <select id="lessonType" required>
                <option value="1">1-й урок</option>
                <option value="2">2-й урок</option>
                <option value="last">Последний урок</option>
            </select>
        </div>
        <div class="form-group">
            <label>Присутствует учащихся на уроке:</label>
            <input type="number" id="presentCount" min="0" placeholder="Введите количество" required>
        </div>
        <button type="submit">Отправить данные</button>
    </form>
    <div id="alertMsg" class="alert alert-success">Данные успешно сохранены!</div>
</div>

<script>
    document.getElementById('lessonForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const className = document.getElementById('className').value.trim().toUpperCase();
        const total = parseInt(document.getElementById('totalCount').value);
        const lessonType = document.getElementById('lessonType').value;
        const count = parseInt(document.getElementById('presentCount').value);
        const today = new Date().toISOString().split('T')[0];

        let db = JSON.parse(localStorage.getItem('attendanceDB')) || [];
        let record = db.find(r => r.date === today && r.className === className);

        if (!record) {
            record = {
                date: today,
                className: className,
                total: total,
                lesson1: null,
                lesson2: null,
                lessonLast: null
            };
            db.push(record);
        }

        // Обновляем общее кол-во
        record.total = total;

        // Записываем данные в зависимости от урока
        if (lessonType === '1') {
            record.lesson1 = count;
        } else if (lessonType === '2') {
            record.lesson2 = count;
        } else if (lessonType === 'last') {
            record.lessonLast = count;
        }

        localStorage.setItem('attendanceDB', JSON.stringify(db));

        // Показ уведомления
        const alert = document.getElementById('alertMsg');
        alert.style.display = 'block';
        setTimeout(() => alert.style.display = 'none', 3000);

        document.getElementById('presentCount').value = '';
    });
</script>

</body>
</html>
